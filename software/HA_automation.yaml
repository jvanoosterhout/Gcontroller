alias: Configure DGB services
description: "Garage services"
triggers:
  - alias: G-controller-rol-deur
    action: mqtt.publish
    metadata: {}
    data:
      qos: "2"
      retain: true
      topic: config/G-controller/devices/rol-deur
      payload: |
        {
          "Devices": [
            {"EntityInfo":
                {
                  "component": "cover",
                  "name": "Rol deur",
                  "qos": 2,
                  "unique_id": "192-168-70-22-cover-rol-deur",
                  "device_class": "garage",
                  "direct_state_transition": false,
                  "device":
                    {
                      "name": "Rol-deur",
                      "model": "Garage rol-deur",
                      "identifiers": "g-rol-deur",
                      "configuration_url": "http://192-168-70-22",
                      "suggested_area": "garage"
                    }
                }
            },
            {"EntityInfo":
                {
                  "component": "switch",
                  "name": "Rol-deur actief",
                  "qos": 2,
                  "unique_id": "192-168-70-22-switch-rol-deur-lock",
                  "icon": "mdi:key-chain-variant",
                  "device":
                    {
                      "name": "Rol-deur",
                      "model": "Garage rol-deur",
                      "identifiers": "g-rol-deur",
                      "configuration_url": "http://192-168-70-22",
                      "suggested_area": "garage"
                    }
                }
            },
            }
          ],
          "Pins": [
              {"PinInfo":
                {
                  "pin": 24,
                  "ptype": "out",
                  "initial": 0,
                  "value": 0,
                  "active_state": false,
                  "blink": 1
                }
              },
              {"PinInfo":
                {
                  "pin": 19,
                  "ptype": "in",
                  "pull_up": true
                }
              },
              {"PinInfo":
                {
                  "pin": 26,
                  "ptype": "in",
                  "pull_up": true
                }
              },
              {"PinInfo":
                {
                  "pin": 13,
                  "ptype": "in",
                  "pull_up": true
                }
              }
            ],
          "Bindings": [
            {"BindInfo": {
              "roller_door_lock$state":
                {
                  "start": {"t_0": {"to": "locked"}},
                  "locked": {
                    "t_unlock": {
                      "all": [{"m": {"$and": [{"unique_id": "192-168-70-22-switch-rol-deur-lock"}, {"payload": "ON"}]}}],
                      "to": "unlocked",
                      "run": [
                        {"timer": {"name": "AutoLock", "action": "start", "seconds": 5}},
                        {"log": {"msg": "rol-deur unlocked for 5 seconds"}}
                      ]
                    },
                    "t_command_blocked": {
                      "all": [{"m": {"$and": [{"unique_id": "192-168-70-22-cover-rol-deur"}, {"$or": [{"payload": "OPEN"}, {"payload": "CLOSE"}, {"payload": "STOP"}]}]}}],
                      "to": "locked",
                      "run": {"log": {"msg": "rol-deur command ignored, lock is engaged"}}
                    }
                  },
                  "unlocked": {
                    "t_command": {
                      "all": [{"m": {"$and": [{"unique_id": "192-168-70-22-cover-rol-deur"}, {"$or": [{"payload": "OPEN"}, {"payload": "CLOSE"}, {"payload": "STOP"}]}]}}],
                      "to": "locked",
                      "run": [
                        {"timer": {"name": "AutoLock", "action": "cancel"}},
                        {"action": {"unique_id": "24", "call": "set_state", "args": [{"state_name": "blink", "state": 1}]}},
                        {"action": {"unique_id": "192-168-70-22-switch-rol-deur-lock", "call": "off"}}
                      ]
                    },
                    "t_lock": {
                      "all": [{"m": {"$and": [{"unique_id": "192-168-70-22-switch-rol-deur-lock"}, {"payload": "OFF"}]}}],
                      "to": "locked",
                      "run": {"timer": {"name": "AutoLock", "action": "cancel"}}
                    },
                    "t_timeout": {
                      "all": [{"m": {"timeout": "AutoLock"}}],
                      "to": "locked",
                      "run": [
                        {"action": {"unique_id": "192-168-70-22-switch-rol-deur-lock", "call": "off"}},
                        {"log": {"msg": "timeout while waiting for a rol-deur command, lock engaged"}}
                      ]
                    }
                  }
                }
              }
            }
          ]
        }
    enabled: true
mode: single