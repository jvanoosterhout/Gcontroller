connectors:
  PI Zero W2:
    pins: [GPIO13, GPIO19, GPIO26, GND, 5V, GPIO24]

  Relay:
    pins: [ GND, VCC, R0, "NC_0", COM_0]

  Optocoupler:
    pins: [OPT_V, OPT_G, OPT_IN, OPT_GND]

  GX12-6:
    pins: [1, 2, 3, 4, 5, 6]

  Roldeur_driver:
    pins: [I1, I2,F1, F2]

  Open_sensor:
    pins: [SIGNAL, GND]

  Closed_sensor:
    pins: [SIGNAL, GND]

cables:
  W_PI_relay:
    wirecount: 3
    colors: [BK, RD, GN]
    show_name: False
    show_wirecount: False

  W_relay_GX12:
    wirecount: 2
    colors: [YE, GN]
    show_name: False
    show_wirecount: False

  W_pi_GX12:
    wirecount: 4
    colors: [OG, BU, BN, BK]
    show_name: False
    show_wirecount: False

  W_GX12_driver:
    wirecount: 2
    colors: [YE, GN]
    show_name: False
    show_wirecount: False

  W_GX12_open:
    wirecount: 2
    colors: [BU, BK]
    show_name: False
    show_wirecount: False

  W_GX12_closed:
    wirecount: 2
    colors: [GN, BK]
    show_name: False
    show_wirecount: False

  W_GX12_opto:
    wirecount: 2
    colors: [WH, BK]
    show_name: False
    show_wirecount: False

  W_opto_driver:
    wirecount: 2
    colors: [RD, GY]
    show_name: False
    show_wirecount: False

connections:
  - - PI Zero W2: [GND, 5V, GPIO24]
    - W_PI_relay: [1, 2, 3]
    - Relay: [GND, VCC, R0]

  - - Relay: ["NC_0", COM_0]
    - W_relay_GX12: [1, 2]
    - GX12-6: [4, 5]

  - - PI Zero W2: [GPIO13, GPIO19, GPIO26, GND]
    - W_pi_GX12: [1, 2, 3, 4]
    - GX12-6: [1, 2, 3, 6]

  - - GX12-6: [4, 5]
    - W_GX12_driver: [1, 2]
    - Roldeur_driver: [F1, F2]

  - - GX12-6: [3, 6]
    - W_GX12_closed: [1, 2]
    - Closed_sensor: [SIGNAL, GND]

  - - GX12-6: [2, 6]
    - W_GX12_open: [1, 2]
    - Open_sensor: [SIGNAL, GND]

  - - GX12-6: [1, 6]
    - W_GX12_opto: [1, 2]
    - Optocoupler: [OPT_V, OPT_G]

  - - Optocoupler: [OPT_IN, OPT_GND]
    - W_opto_driver: [1, 2]
    - Roldeur_driver: [I1, I2]

tweak:
  append: | 
    { rank=same; Roldeur_driver; Open_sensor;Closed_sensor }
    { rank=same; Optocoupler; W_GX12_driver; W_GX12_closed }
  override:
    graph:
      ranksep: "0.5"
    W_PI_relay:
      shape: none
      fontsize: "1"
      fontcolor: white
    W_relay_GX12:
      shape: none
      fontsize: "1"
      fontcolor: white
    W_pi_GX12:
      shape: none
      fontsize: "1"
      fontcolor: white
    W_GX12_driver:
      shape: none
      fontsize: "1"
      fontcolor: white
    W_GX12_open:
      shape: none
      fontsize: "1"
      fontcolor: white
    W_GX12_closed:
      shape: none
      fontsize: "1"
      fontcolor: white
    W_GX12_opto:
      shape: none
      fontsize: "1"
      fontcolor: white
    W_opto_driver:
      shape: none
      fontsize: "1"
      fontcolor: white